{{- $root := . -}}
{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" $root }}-{{ $name }}
  labels:
    {{- include "ecommerce.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $service.replicas | default $root.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.imagePrefix }}-{{ $name }}:{{ $root.Values.imageTag }}"
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            - name: SERVER_PORT
              value: "{{ $service.port }}"
            - name: CONFIG_SERVER_URL
              value: {{ default (printf "http://%s-config-server:8888" (include "ecommerce.fullname" $root)) $root.Values.external.configUrl | quote }}
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: {{ default (printf "http://%s-discovery-server:8761/eureka/" (include "ecommerce.fullname" $root)) $root.Values.external.eurekaUrl | quote }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ $root.Values.external.kafkaBootstrapServers }}"
            - name: ZIPKIN_ENDPOINT
              value: "{{ $root.Values.external.zipkinEndpoint }}"
            {{- if $service.database }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $root.Values.external.postgresHost }}:5432/{{ $service.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: ecommerce
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: {{ $root.Values.secrets.postgresPasswordKey }}
            {{- end }}
            {{- if $service.redis }}
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ $root.Values.external.redisHost }}"
            {{- end }}
            {{- if $service.jwt }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: {{ $root.Values.secrets.jwtSecretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
{{- end }}
