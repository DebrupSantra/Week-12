global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "config-server:8888"
          - "discovery-server:8761"
          - "product-service:8081"
          - "order-service:8082"
          - "payment-service:8083"
          - "user-service:8084"
          - "inventory-service:8085"
          - "notification-service:8086"
